url: https://long39ng.github.io/gganime/

template:
  bootstrap: 5

reference:
  - title: Animate
    desc: >
      Render a gganimate plot as an animated-SVG htmlwidget.
    contents:
      - anime

  - title: Shiny
    desc: >
      Use gganime widgets in Shiny applications.
